name: Check Community Mine
on:
  push:
    paths: ['scripts/**', 'README.md', '.github/workflows/mine-check.yml']
  pull_request:
    paths: ['scripts/**', 'README.md', '.github/workflows/mine-check.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
