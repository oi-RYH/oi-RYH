<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 118" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">현재 퀘스트 게시판</title><desc id="desc">나무 게시판에 세 장의 프로젝트 의뢰서가 걸려 있습니다.</desc>
